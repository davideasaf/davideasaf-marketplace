[project]
name = "nanobanana-image-gen"
version = "1.1.0"
description = "Generate images using Gemini API with transparent background support"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-auth>=2.0.0",
    "Pillow>=10.0.0",
    "rembg>=2.0.50",
    "numba>=0.60.0",  # Required for Python 3.11+ compatibility
    "onnxruntime>=1.14.0",  # CPU backend for rembg
]

[tool.uv]
dev-dependencies = []
